[package]
name = "botpack-wasm"
description = "wasm-bindgen bindings for the botpack affect engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["robotics", "wasm", "affect", "determinism"]
categories = ["science::robotics", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
botpack-affect = { version = "0.1.0", path = "../botpack-affect" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"