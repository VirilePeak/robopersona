[package]
name = "botpack-affect"
description = "Deterministic affect engine for robot personas (PAD model, ODE decay, no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["robotics", "affect", "determinism", "no-std", "wasm"]
categories = ["science::robotics", "no-std", "wasm"]

[dependencies]
serde = { version = "1", features = ["derive"], default-features = false }
thiserror = { version = "2", default-features = false }
libm = "0.2"

[dev-dependencies]
serde_json.workspace = true