[package]
name = "botpack-python"
description = "Python bindings for the botpack affect engine (pyo3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "botpack"
crate-type = ["cdylib", "rlib"]

[dependencies]
botpack-affect = { path = "../botpack-affect" }
pyo3 = { version = "0.23", features = ["extension-module"] }