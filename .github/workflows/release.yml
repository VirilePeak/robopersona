name: Release

# Tag-triggered only: pushing the workflow itself must not create a release.
# workflow_dispatch exists for dry-run verification of the pipeline.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  # actions: write is required by upload/download-artifact (Artifact API).
  # Job-level permissions REPLACE the workflow set — they do not inherit.
  actions: write

jobs:
  gate:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    # A tag does not re-trigger CI (CI runs on push to main only), so the
    # release pipeline re-runs the full gate before shipping anything.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Gate (fmt, clippy, tests)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --exclude botpack-python --all-targets --locked -- -D warnings
          cargo test --workspace --exclude botpack-python --locked

  cli:
    needs: gate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            triple: aarch64-apple-darwin
        # No arm64-linux leg yet: the `ubuntu-24.04-arm` label is not
        # confirmed, and a missing/hanging runner would block `publish`
        # (needs: [cli, wasm]) — including the macOS artifacts. Add it as a
        # separate follow-up once the label is verified.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI (${{ matrix.triple }})
        run: cargo build -p botpack --release --locked --target ${{ matrix.triple }}
      - name: Smoke test (native build, host triple)
        run: |
          set -e
          BIN="target/${{ matrix.triple }}/release/botpack"
          rm -rf /tmp/bp-src /tmp/bp-out /tmp/t.botpack
          mkdir -p /tmp/bp-src
          # Compact JSON, no trailing newline — byte preservation is part of
          # the contract (SPEC §3.4).
          printf '%s' '{"format_version":"0.1.0","name":"atlas-caretaker","version":"0.1.0","persona":{"display_name":"Atlas Caretaker","languages":["en"]}}' > /tmp/bp-src/manifest.json
          echo payload > /tmp/bp-src/a.txt
          "$BIN" pack /tmp/bp-src -o /tmp/t.botpack
          "$BIN" verify /tmp/t.botpack
          "$BIN" unpack /tmp/t.botpack -o /tmp/bp-out
          diff -r /tmp/bp-src /tmp/bp-out
          cmp /tmp/bp-src/manifest.json /tmp/bp-out/manifest.json
          echo "SMOKE OK (${{ matrix.triple }})"
      - name: Stage
        run: |
          mkdir -p stage
          cp "target/${{ matrix.triple }}/release/botpack" "stage/botpack-${{ matrix.triple }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.triple }}
          path: stage/

  wasm:
    needs: gate
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # --- wasm toolchain, pinned to Cargo.lock versions ---
      # Extract dirs are discovered, not assumed: tarball roots have changed
      # between releases before. These x86_64 tarballs must NOT be moved to
      # macOS or arm runners.
      - name: Install wasm-opt (Binaryen 133)
        run: |
          set -e
          curl -fsSL -o binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  binaryen.tar.gz" | sha256sum -c -
          mkdir binen && tar xzf binaryen.tar.gz -C binen
          OPT="$(find binen -type f -name wasm-opt -print -quit)"
          test -x "$OPT" || { echo "wasm-opt not found in binaryen tarball"; exit 1; }
          echo "wasm-opt: $OPT"
          echo "$(dirname "$OPT")" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen CLI 0.2.128
        # Must match the wasm-bindgen crate version in Cargo.lock; keep them in sync.
        run: |
          set -e
          curl -fsSL -o wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          echo "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  wasm-bindgen.tar.gz" | sha256sum -c -
          mkdir wbg && tar xzf wasm-bindgen.tar.gz -C wbg
          WBG="$(find wbg -type f -name wasm-bindgen -print -quit)"
          test -x "$WBG" || { echo "wasm-bindgen not found in tarball"; exit 1; }
          echo "wasm-bindgen: $WBG"
          echo "$(dirname "$WBG")" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          wasm-opt --version
          wasm-bindgen --version

      # --- wasm artifact (script expects both tools on PATH, writes dist/wasm) ---
      - name: Build wasm artifact
        run: sh ./scripts/build-wasm.sh dist/wasm

      - name: Stage
        run: |
          mkdir -p stage
          tar czf stage/botpack-wasm.tar.gz -C dist wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifact
          path: stage/

  publish:
    needs: [cli, wasm]
    runs-on: ubuntu-24.04
    permissions:
      # Job-level override: this set REPLACES the workflow-level set.
      # actions: write for upload/download-artifact; contents: write for
      # `gh release create` (write covers read).
      contents: write
      actions: write
    steps:
      # merge-multiple: flatten all job artifacts into one directory —
      # otherwise `gh release create stage/*` would upload directories.
      # Explicit patterns instead of "*": a re-run would otherwise also pull
      # the combined `release-artifacts` artifact and poison the checksum step.
      - uses: actions/download-artifact@v4
        with:
          pattern: "cli-*"
          merge-multiple: true
          path: stage/
      - uses: actions/download-artifact@v4
        with:
          pattern: "wasm-artifact"
          merge-multiple: true
          path: stage/

      - name: Checksums (single SHA256SUMS over all files)
        run: |
          cd stage
          sha256sum botpack-* > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Upload combined artifact (dry-run inspectable)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: stage/

      # Notes are built unconditionally so a dispatch dry-run exercises and
      # prints them; only the release creation itself is tag-gated.
      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## .botpack ${TAG} — reference implementation"
            echo
            echo "CLI binaries (native builds, no cross-compile):"
            echo
            while IFS= read -r f; do
              echo "- \`$(basename "$f")\`"
            done < <(ls stage/botpack-* | grep -v wasm.tar.gz)
            echo "- \`botpack-wasm.tar.gz\` — browser wasm bindings; JS entry point inside the tarball is \`wasm/botpack_wasm_opt.js\`."
            echo "- \`SHA256SUMS\` — checksums for the above."
            echo
            echo "Crates are **not** published to crates.io yet. Spec: [SPEC.md](https://github.com/VirilePeak/robopersona/blob/main/SPEC.md)."
          } > notes.md
          cat notes.md

      # --- GitHub Release only for real v* tags, never for dispatch ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "botpack ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            stage/*