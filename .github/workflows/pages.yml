name: Pages

# Builds the project page from SPEC.md and conformance/affect-reference.json
# (site/build.py) and deploys it to GitHub Pages. Branch-filtered: tag pushes
# never run this workflow, so it cannot interact with release.yml.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "SPEC.md"
      - "conformance/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # base_url follows the Pages configuration: the project URL today, the
      # custom domain once one is set. The switch needs no workflow change,
      # only a re-run (workflow_dispatch) so canonical URLs pick it up.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install renderer (hash-pinned)
        run: |
          python -m pip install --require-hashes --only-binary :all: --no-deps -r site/requirements.txt
      # The in-browser check runs the released wasm, not a fresh build: the page
      # demonstrates exactly what users download. Bump tag and sha256 together;
      # the hash is the release's SHA256SUMS entry for botpack-wasm.tar.gz.
      - name: Fetch release wasm (v0.1.1, sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/botpack-wasm.tar.gz" \
            https://github.com/VirilePeak/robopersona/releases/download/v0.1.1/botpack-wasm.tar.gz
          echo "307376ec0c1c12b43a00ae44a1be2a44e21f783c61e30e682aeb50ffc985675f  $RUNNER_TEMP/botpack-wasm.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/botpack-wasm.tar.gz" -C "$RUNNER_TEMP"
      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python site/build.py --out _site --base-url "$BASE_URL" --wasm "$RUNNER_TEMP/wasm" --wasm-tag v0.1.1
      - name: Link check
        run: |
          python site/check.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
