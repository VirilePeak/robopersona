name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude botpack-python --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude botpack-python

  wasm:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build affect engine (no_std proof)
        run: cargo build -p botpack-affect --target wasm32-unknown-unknown --release
      - name: Build wasm bindings
        run: cargo build -p botpack-wasm --target wasm32-unknown-unknown --release

  python:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + functional test
        run: |
          pip install maturin
          maturin build -m crates/botpack-python/Cargo.toml -o dist
          pip install dist/*.whl
          python conformance/check_python.py

  node:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    # wasm-bindgen CLI must match the crate version in Cargo.lock.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen CLI 0.2.128
        run: |
          set -euo pipefail
          curl -fsSL -o wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          echo "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  wasm-bindgen.tar.gz" | sha256sum -c -
          mkdir wbg && tar xzf wasm-bindgen.tar.gz -C wbg
          WBG="$(find wbg -type f -name wasm-bindgen -print -quit)"
          test -x "$WBG" || { echo "wasm-bindgen not found in tarball"; exit 1; }
          echo "$(dirname "$WBG")" >> "$GITHUB_PATH"
      - name: Build node bindings + conformance
        run: |
          cargo build -p botpack-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir crates/botpack-wasm/tests/node/pkg \
            target/wasm32-unknown-unknown/release/botpack_wasm.wasm
          node crates/botpack-wasm/tests/node/test.js

  cli:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CLI end-to-end
        run: |
          cargo build -p botpack
          mkdir -p /tmp/bp-src
          cat > /tmp/bp-src/manifest.json <<'EOF'
          {"format_version":"0.1.0","name":"atlas-caretaker","version":"0.1.0","persona":{"display_name":"Atlas Caretaker","languages":["en"]}}
          EOF
          echo "hello" > /tmp/bp-src/greeting.txt
          target/debug/botpack pack /tmp/bp-src -o /tmp/t.botpack
          target/debug/botpack verify /tmp/t.botpack
          target/debug/botpack unpack /tmp/t.botpack -o /tmp/bp-out
          diff -r /tmp/bp-src /tmp/bp-out
          echo "CLI E2E OK"