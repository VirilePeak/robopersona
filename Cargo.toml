[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VirilePeak/robopersona"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
botpack-core = { version = "0.1.1", path = "crates/botpack-core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"